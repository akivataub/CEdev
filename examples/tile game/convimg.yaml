palettes:
  - name: global_palette
    fixed-entries:
      - color: {index: 0, r: 0, g: 0, b: 0}     # Transparent
      - color: {index: 1, r: 255, g: 0, b: 0}   # Red
      - color: {index: 2, r: 0, g: 0, b: 0}     # Dummy
      - color: {index: 3, r: 0, g: 0, b: 0}     # Dummy
    images: automatic

converts:
  - name: sprites
    palette: global_palette
    transparent-color-index: 0
    images:
      - tile_back.png

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - global_palette
    converts:
      - sprites