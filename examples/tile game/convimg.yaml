palettes:
  - name: global_palette
    fixed-entries:
    - color: {index: 0, r: 0, g: 0, b: 0}
    - color: {index: 1, r: 14, g: 7, b: 27}
    - color: {index: 2, r: 26, g: 25, b: 50}
    - color: {index: 3, r: 42, g: 47, b: 78}
    - color: {index: 4, r: 51, g: 152, b: 75}
    - color: {index: 5, r: 199, g: 207, b: 221}
    - color: {index: 6, r: 255, g: 255, b: 255}
    images: automatic

converts:
  - name: sprites
    palette: global_palette
    transparent-color-index: 0
    bpp: 8  # Force 8bpp for simple byte-per-pixel access
    images:
      - tile_back.png
      - ntwo.png
      - nthree.png
      - nfour.png
      - ace.png

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - global_palette
    converts:
      - sprites