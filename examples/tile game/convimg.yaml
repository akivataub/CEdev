converts:
  - name: sprites
    palette: global_palette
    transparent-color-index: 0
    bpp: 8  # Force 8bpp for simple byte-per-pixel access
    images:
      - tile_back.png

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - global_palette
    converts:
      - sprites